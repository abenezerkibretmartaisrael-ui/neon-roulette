<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Roulette Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff3366;
            --dark-bg: #070a13;
            --card-bg: #111625;
            --neon-amber: #ffaa00;
        }

        body {
            margin: 0; background: var(--dark-bg); color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column; align-items: center;
            user-select: none; -webkit-user-select: none;
        }

        /* Top Bar Layout */
        .top-bar {
            width: 100%; max-width: 420px; padding: 15px; display: flex;
            box-sizing: border-box; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #1a2238; background: rgba(17, 22, 37, 0.6);
        }
        #timer { font-weight: bold; font-size: 18px; text-shadow: 0 0 8px var(--neon-cyan); }
        #user-balance { font-weight: bold; font-size: 16px; color: #fff; }

        /* Board Elements Grid */
        .board {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;
            padding: 25px 15px; width: 100%; max-width: 400px; box-sizing: border-box;
        }

        .circle {
            width: 60px; height: 60px; border: 2px solid var(--neon-cyan);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; cursor: pointer; transition: all 0.2s ease;
            background: rgba(0, 255, 204, 0.03); box-shadow: inset 0 0 6px rgba(0, 255, 204, 0.1);
        }
        .circle.selected { 
            background: var(--neon-cyan); color: var(--dark-bg); 
            transform: scale(1.08); box-shadow: 0 0 15px var(--neon-cyan); 
        }

        /* Controls Layout Interface */
        .bet-controls { padding: 10px 20px; width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        input { 
            width: 90%; padding: 14px; margin-bottom: 15px; background: #111625; 
            color: #fff; border: 1px solid #222e4d; border-radius: 8px; font-size: 16px; text-align: center;
        }
        input:focus { border-color: var(--neon-cyan); outline: none; }
        
        button { 
            width: 90%; padding: 16px; background: var(--neon-pink); border: none; 
            color: #fff; font-weight: bold; font-size: 16px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.3); transition: all 0.2s ease;
        }
        button:active { transform: scale(0.98); opacity: 0.9; }
        
        #status-logger { font-size: 14px; margin-top: 15px; font-weight: 500; min-height: 20px; }
        .odds-display { font-size: 13px; color: #8a9fc4; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="timer" style="color: var(--neon-cyan);">60s</div>
        <div id="user-balance">0.00 Birr</div>
    </div>

    <div class="board" id="roulette-board">
        <div class="circle" onclick="toggleNumber(1)">1</div>
        <div class="circle" onclick="toggleNumber(2)">2</div>
        <div class="circle" onclick="toggleNumber(3)">3</div>
        <div class="circle" onclick="toggleNumber(4)">4</div>
        <div class="circle" onclick="toggleNumber(5)">5</div>
        <div class="circle" onclick="toggleNumber(6)">6</div>
        <div class="circle" onclick="toggleNumber(7)">7</div>
        <div class="circle" onclick="toggleNumber(8)">8</div>
        <div class="circle" onclick="toggleNumber(9)">9</div>
        <div class="circle" onclick="toggleNumber(10)">10</div>
    </div>

    <div class="bet-controls">
        <div class="odds-display" id="odds-multiplier">Select numbers to calculate payout potential</div>
        <input type="number" id="bet-amount" placeholder="Enter Wager Amount (Birr)" inputmode="decimal">
        <button id="submit-bet-btn" onclick="placeBet()">PLACE BET</button>
        <p id="status-logger"></p>
    </div>

    <script>
        // CHANGE THIS EXACT STRING MATCH TO YOUR RECENT REVERSE SSH TUNNEL URL EACH TIME YOU RELAUNCH
        const API_BASE = "https://696f646e916aad.lhr.life"; 
        
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Dynamic fetch of verified data parameter matrix from Telegram client wrapper strings
        const userId = tg.initDataUnsafe?.user?.id || 123456; 
        let selectedNumbers = [];

        function toggleNumber(num) {
            const index = selectedNumbers.indexOf(num);
            const circles = document.querySelectorAll('.circle');
            
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                circles[num-1].classList.remove('selected');
            } else {
                selectedNumbers.push(num);
                circles[num-1].classList.add('selected');
            }
            updateOddsInterface();
        }

        function updateOddsInterface() {
            const display = document.getElementById('odds-multiplier');
            if(selectedNumbers.length === 0) {
                display.innerText = "Select numbers to calculate payout potential";
                display.style.color = "#8a9fc4";
            } else {
                const calculatedOdds = (10.0 / selectedNumbers.length).toFixed(1);
                display.innerText = `Target Selected: ${selectedNumbers.length} | Return Payout Odds: ${calculatedOdds}x`;
                display.style.color = "var(--neon-cyan)";
            }
        }

        // Independent, isolated fetch loops ensuring one failure won't crash the document
        async function fetchUniversalTimer() {
            try {
                const res = await fetch(`${API_BASE}/api/game_state`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                
                const timerElement = document.getElementById('timer');
                if (data.status === "processing") {
                    timerElement.innerText = "Spun!";
                    timerElement.style.color = "var(--neon-amber)";
                } else {
                    timerElement.innerText = data.timer + "s";
                    timerElement.style.color = "var(--neon-cyan)";
                }
            } catch (e) {
                document.getElementById('timer').innerText = "Syncing...";
                document.getElementById('timer').style.color = "#ff3366";
            }
        }

        async function fetchUserBalance() {
            try {
                const res = await fetch(`${API_BASE}/api/user_info?user_id=${userId}`);
                if (!res.ok) throw new Error();
                const data = await res.json();
                document.getElementById('user-balance').innerText = data.balance.toFixed(2) + " Birr";
            } catch (e) {
                document.getElementById('user-balance').innerText = "Offline";
            }
        }

        async function placeBet() {
            const amountField = document.getElementById('bet-amount');
            const amount = amountField.value;
            const logger = document.getElementById('status-logger');
            
            if (selectedNumbers.length === 0 || !amount || parseFloat(amount) <= 0) {
                logger.innerText = "⚠️ Please select numbers and a valid amount!";
                logger.style.color = "var(--neon-amber)";
                return;
            }

            logger.innerText = "⏳ Processing wager transfer locks...";
            logger.style.color = "#fff";

            try {
                const response = await fetch(`${API_BASE}/api/place_bet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId, 
                        amount: parseFloat(amount), 
                        numbers: selectedNumbers 
                    })
                });

                const data = await response.json();
                if (data.success) {
                    logger.innerText = "✅ Bet Placed Successfully! Best of luck.";
                    logger.style.color = "var(--neon-cyan)";
                    amountField.value = ""; // Clean value matrix inputs
                    // Fast immediate balance check to register deduction visual feedback
                    fetchUserBalance(); 
                } else {
                    logger.innerText = "❌ " + data.error;
                    logger.style.color = "var(--neon-pink)";
                }
            } catch (e) {
                logger.innerText = "❌ Connection Failed. Check your Termux SSH tunnel link.";
                logger.style.color = "var(--neon-pink)";
            }
        }

        // Orchestrated independent execution cycle loops
        setInterval(fetchUniversalTimer, 1000);
        setInterval(fetchUserBalance, 3000); // Balance updates every 3 seconds to preserve thread lock speeds

        // Initial launch triggers
        fetchUniversalTimer();
        fetchUserBalance();
    </script>
</body>
</html>
