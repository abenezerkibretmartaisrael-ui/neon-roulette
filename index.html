<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Roulette</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-cyan: #00ffcc;
            --neon-pink: #ff3366;
            --dark-bg: #070a13;
            --card-bg: #111625;
        }

        body {
            margin: 0; background: var(--dark-bg); color: #fff;
            font-family: sans-serif; display: flex; flex-direction: column; align-items: center;
        }

        /* Top Bar */
        .top-bar {
            width: 100%; max-width: 420px; padding: 15px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 1px solid #222;
        }

        /* Roulette Board */
        .board {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px;
            padding: 20px; width: 100%; max-width: 400px;
        }

        .circle {
            width: 60px; height: 60px; border: 2px solid var(--neon-cyan);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        .circle.selected { background: var(--neon-cyan); color: var(--dark-bg); transform: scale(1.1); }

        /* Controls */
        .bet-controls { padding: 20px; width: 100%; max-width: 400px; text-align: center; }
        input { width: 80%; padding: 10px; margin-bottom: 10px; background: #222; color: #fff; border: none; }
        button { width: 85%; padding: 15px; background: var(--neon-pink); border: none; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div id="timer" style="color: var(--neon-cyan);">60s</div>
        <div id="user-balance">0.00 Birr</div>
    </div>

    <div class="board" id="roulette-board">
        <div class="circle" onclick="toggleNumber(1)">1</div>
        <div class="circle" onclick="toggleNumber(2)">2</div>
        <div class="circle" onclick="toggleNumber(3)">3</div>
        <div class="circle" onclick="toggleNumber(4)">4</div>
        <div class="circle" onclick="toggleNumber(5)">5</div>
        <div class="circle" onclick="toggleNumber(6)">6</div>
        <div class="circle" onclick="toggleNumber(7)">7</div>
        <div class="circle" onclick="toggleNumber(8)">8</div>
        <div class="circle" onclick="toggleNumber(9)">9</div>
        <div class="circle" onclick="toggleNumber(10)">10</div>
    </div>

    <div class="bet-controls">
        <input type="number" id="bet-amount" placeholder="Enter Amount (Birr)">
        <button id="submit-bet-btn" onclick="placeBet()">PLACE BET</button>
        <p id="status-logger" style="font-size: 12px; margin-top: 10px;"></p>
    </div>

    <script>
        const API_BASE = "https://1b4680a6e933c0.lhr.life"; // UPDATE THIS!
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 123456; 
        
        let selectedNumbers = [];

        function toggleNumber(num) {
            const index = selectedNumbers.indexOf(num);
            if (index > -1) {
                selectedNumbers.splice(index, 1);
                document.querySelectorAll('.circle')[num-1].classList.remove('selected');
            } else {
                selectedNumbers.push(num);
                document.querySelectorAll('.circle')[num-1].classList.add('selected');
            }
        }

        async function updateState() {
            try {
                // Update Timer
                const stateRes = await fetch(`${API_BASE}/api/game_state`);
                const state = await stateRes.json();
                document.getElementById('timer').innerText = state.timer + "s";

                // Update Balance
                const userRes = await fetch(`${API_BASE}/api/user_info?user_id=${userId}`);
                const user = await userRes.json();
                document.getElementById('user-balance').innerText = user.balance.toFixed(2) + " Birr";
            } catch (e) {
                console.error("API Connection Error");
            }
        }

        async function placeBet() {
            const amount = document.getElementById('bet-amount').value;
            if (selectedNumbers.length === 0 || !amount) return alert("Select numbers and amount!");

            const response = await fetch(`${API_BASE}/api/place_bet`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, amount: amount, numbers: selectedNumbers })
            });

            const data = await response.json();
            if (data.success) {
                document.getElementById('status-logger').innerText = "✅ Bet Placed!";
            } else {
                document.getElementById('status-logger').innerText = "❌ " + data.error;
            }
        }

        setInterval(updateState, 1000);
        updateState();
    </script>
</body>
</html>
